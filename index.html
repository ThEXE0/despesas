<html lang="pt-BR"><head><meta charset="utf-8">

<style>

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}

.lb{color:var(--mut);font-size:13px}.big{font-size:20px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--warn)}

.ib{background:none;border:0;color:var(--mut);font-size:16px;padding:2px 5px}
.al{border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid currentColor}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff;border:0;border-radius:28px;padding:13px 20px;font:600 15px system-ui;box-shadow:0 6px 18px #0008}

nav button{flex:1;background:none;border:0;color:var(--mut);font:10px system-ui;padding:4px 0}nav svg{display:block;margin:0 auto 3px;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--pri)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}#modal.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl{grid-column:1/-1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px;font:600 15px system-ui}.btn.g{background:var(--bd)}
section{display:none}section.on{display:block}

:root{--pu:#8b5cf6}.pu{color:var(--pu)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hd small{display:block;color:var(--mut);font-size:13px}
.lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:grid;place-items:center}

.seg{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:none}

.card>b{font-size:17px}.kp .card{background:#0f1829}.kp .big{font-size:16px}
.mc{display:flex;gap:10px;align-items:center}.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}

.kk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kk button{padding:10px 2px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px}.kk b{display:block;font-size:20px;font-weight:400}

#modal{align-items:stretch}#sheet{max-width:none;max-height:none;height:100%;border-radius:0;align-content:start;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.btn{background:linear-gradient(90deg,#2563eb,#3b82f6)}#sv{padding:14px;font-size:16px;margin-top:4px}
</style></head><body><main>
<div class="hd"><div class="lg"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/></svg></div><div style="flex:1"><h1 id="ttl" style="font-size:19px">Controle Financeiro</h1><small id="sub">Pessoal e Negócio</small></div><button class="bell" id="bell">🔔<i id="dot" style="display:none"></i></button></div>

<input type="month" id="mes">

<section id="v-home" class="on"><div id="al"></div><div class="card"><b>Resumo do mês</b><div class="kp" id="kp" style="margin:10px 0 0"></div></div>

<div class="card"><b>Contas a pagar</b><div id="pend"></div></div>
<div class="card"><b>Últimas transações</b><div id="rec"></div></div></section>

<section id="v-tx"><div class="card"><input id="q" placeholder="Buscar descrição"><div class="row" style="margin-top:8px"><select id="fc" style="flex:1"></select><select id="so" style="flex:1"><option value="d">Mais recentes</option><option value="v">Maior valor</option></select></div></div><div class="card" id="txl"></div></section>

<section id="v-cfg"><div class="card"><b>Faturas do mês por cartão</b><div id="cards"></div></div>
<div class="card"><b>Backup dos dados</b><textarea id="io" rows="5" placeholder="Os dados aparecem aqui"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="exp">Exportar</button><button class="btn g" id="imp">Importar</button></div></div></section>
</main>

<button class="fab" id="fab">+ Nova transação</button>
<nav id="nav"><button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button><button data-v="tx"><svg viewBox="0 0 24 24"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg>Transações</button><button data-v="rep"><svg viewBox="0 0 24 24"><path d="M5 21V10M12 21V4M19 21v-7"/></svg>Relatórios</button><button data-v="neg"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Negócio</button><button data-v="cfg"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Configurações</button></nav>

<div id="modal"><div id="sheet">
<div class="fl row" style="flex-wrap:nowrap"><button class="ib" id="bk" style="font-size:24px">←</button><b id="mt" style="font-size:20px">Nova transação</b></div>
<div class="fl kk" id="kk"><button data-k="R"><b>↓</b>Receita</button><button data-k="D" class="on"><b>↗</b>Despesa</button><button data-k="T"><b>⇄</b>Transferência</button></div>
<div class="fl"><label>Descrição *</label><input id="desc" placeholder="Ex.: Compra de estoque"></div>
<div><label>Valor total (R$) *</label><input id="val" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label>Data *</label><input id="data" type="date"></div>
<div class="fl"><label>Origem</label><div class="seg" id="og" style="margin:0"><button data-o="P" class="on">Pessoal</button><button data-o="N">Negócio</button></div><input type="hidden" id="tipo" value="P"></div>
<div class="fl"><label>Categoria *</label><select id="cat"></select></div>
<div><label>Forma de pagamento</label><select id="pg"><option>Pix</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Dinheiro</option><option>Boleto</option><option>Transferência</option></select></div>
<div><label>Situação</label><select id="stt"><option value="pago">Pago</option><option value="pendente">Pendente</option></select></div>
<div id="pw"><label>Parcelas</label><input id="par" type="number" min="1" max="48" value="1"></div>
<div><label>Cartão / conta</label><input id="car" list="cars" placeholder="Opcional"><datalist id="cars"></datalist></div>
<div id="cw" class="fl" style="display:none"><label>Canal de venda</label><select id="canal"><option>Mercado Livre</option><option>Shopee</option><option>Outros</option></select></div>
<div class="fl"><label>Observações</label><textarea id="obs" rows="2" placeholder="Opcional"></textarea></div>
<button class="btn fl" id="sv">Salvar transação</button>
</div></div>

<script>
const $=id=>document.getElementById(id),R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={itens:[],orc:{}};try{st=JSON.parse(localStorage.getItem("despesas-v1"))||st}catch(e){}

const addD=(s,n)=>{const[y,m,d]=s.split("-").map(Number),t=new Date(y,m+n,0).getDate(),x=new Date(y,m-1+n,Math.min(d,t));return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const mon=(m,f=inF)=>st.itens.filter(i=>i.data.startsWith(m)&&f(i)),sum=(a,k)=>a.filter(i=>kd(i)===k).reduce((s,i)=>s+i.val,0),br=d=>d.split("-").reverse().join("/");

const row=i=>{const k=kd(i),s=stt(i),c=k==="R"?"ok":k==="D"?"bad":"",g=k==="R"?"+":k==="D"?"−":"";
return `<div class="it"><div><div>${esc(i.desc)}</div><div class="lb">${br(i.data)} · ${esc(i.cat)}<span class="tg ${i.tipo==="N"?"pu":""}">${i.tipo==="N"?"Negócio":"Pessoal"}</span>${s!=="pago"?`<span class="tg ${s==="vencido"?"bad":"wn"}">${s}</span>`:""}</div></div><div style="text-align:right"><b class="${c}">${g}${R(i.val)}</b><div><button class="ib" data-a="e" data-id="${i.id}">✎</button><button class="ib" data-a="d" data-id="${i.id}">⧉</button><button class="ib" data-a="x" data-id="${i.id}">×</button></div></div></div>`};
const MN=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const mk=(c,g,l,v,cl,x="")=>`<div class="card"><div class="mc"><div class="ic" style="background:${c}2e;color:${c}">${g}</div><div><div class="lb">${l}</div><div class="big ${cl}">${v}</div></div></div>${x}</div>`;
function render(){
const m=$("mes").value,a=mon(m),rec=sum(a,"R"),des=sum(a,"D"),sal=rec-des,orc=st.orc[m+"|"+aba]||0,pct=orc?des/orc*100:0;
$("fil").style.display=view==="cfg"||view==="neg"?"none":"";
$("ttl").textContent={home:"Controle Financeiro",tx:"Transações",rep:"Relatórios",neg:"Negócio",cfg:"Configurações"}[view];$("sub").style.display=view==="home"?"":"none";
const pend=st.itens.filter(i=>kd(i)!=="T"&&inF(i)&&stt(i)!=="pago").sort((x,y)=>x.data.localeCompare(y.data)),venc=pend.filter(i=>stt(i)==="vencido"),prox=pend.filter(i=>stt(i)==="pendente"&&i.data<=lim);

$("kp").innerHTML=mk("#22c55e","↓","Receitas",R(rec),"ok")+mk("#ef4444","↑","Despesas",R(des),"bad")+mk("#3b82f6","$","Saldo do mês",R(sal),sal<0?"bad":"ok")+mk("#f59e0b","%","Orçamento usado",orc?pct.toFixed(1).replace(".",",")+"%":"—","",orc?`<div class="bar"><i style="width:${Math.min(100,pct)}%;background:${pct>=100?"var(--bad)":pct>=80?"var(--warn)":"var(--ok)"}"></i></div>`:`<div class="lb">Defina abaixo</div>`);

if(document.activeElement!==$("orc"))$("orc").value=orc||"";
$("pend").innerHTML=pend.slice(0,5).map(row).join("")||VZ;
$("rec").innerHTML=[...a].sort((x,y)=>y.data.localeCompare(x.data)).slice(0,5).map(row).join("")||VZ;
const cats=[...new Set(st.itens.map(i=>i.cat))].sort(),fv=$("fc").value;
$("fc").innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");$("fc").value=cats.includes(fv)?fv:"";
const q=$("q").value.toLowerCase(),l=a.filter(i=>(!q||i.desc.toLowerCase().includes(q))&&(!$("fc").value||i.cat===$("fc").value));

$("bars").innerHTML=`<svg viewBox="0 0 320 140" width="100%">`+[0,1,2,3,4].map(g=>{const y=110-g*25;return `<line x1="44" x2="316" y1="${y}" y2="${y}" stroke="#22304a"/><text x="38" y="${y+3}" font-size="9" fill="#8b9ab3" text-anchor="end">R$ ${fk(mx*g/4)}</text>`}).join("")+ms.map((x,n)=>vl[n].map((v,j)=>`<rect x="${52+n*44+j*16}" y="${110-v/mx*100}" width="14" height="${v/mx*100}" rx="3" fill="${j?"#8b5cf6":"#3b82f6"}"/>`).join("")+`<text x="${67+n*44}" y="126" font-size="10" fill="#8b9ab3" text-anchor="middle">${MN[+x.slice(5)-1]}</text>`).join("")+`</svg><div class="lb" style="text-align:center"><span style="color:#3b82f6">●</span> Pessoal &nbsp; <span style="color:#8b5cf6">●</span> Negócio</div>`;
const cs=byCat(a);let of=0;
$("donut").innerHTML=des?`<svg viewBox="0 0 120 120" width="150">`+cs.map(([c,v],n)=>{const L=v/des*251.3,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${PAL[n%7]}" stroke-width="18" stroke-dasharray="${L} ${251.3-L}" stroke-dashoffset="${-of}" transform="rotate(-90 60 60)"/>`;of+=L;return s}).join("")+`<text x="60" y="63" text-anchor="middle" font-size="10" fill="#e6ecf5">${R(des)}</text></svg>`:"";
$("leg").innerHTML=cs.map(([c,v],n)=>`<div class="row sp"><span><span style="color:${PAL[n%7]}">●</span> ${esc(c)}</span><span>${(v/des*100).toFixed(1).replace(".",",")}%</span></div>`).join("")||VZ;
const pv=sum(mon(addM(m,-1)),"D"),df=pv?(des-pv)/pv*100:null;
$("cmp").innerHTML=df===null?'<span class="lb">Sem dados do mês anterior.</span>':`<b class="${df>0?"bad":"ok"}">${df>0?"▲":"▼"} ${Math.abs(df).toFixed(0)}%</b> <span class="lb">vs. mês anterior (${R(pv)})</span>`;
$("top").innerHTML=cs.slice(0,3).map(([c,v],n)=>`<div class="row sp"><span>${n+1}. ${esc(c)}</span><b class="bad">${R(v)}</b></div>`).join("")||VZ;
const nn=mon(m,i=>i.tipo==="N"),fat=sum(nn,"R"),dn=sum(nn,"D"),cn=byCat(nn),cl={};nn.filter(i=>kd(i)==="R").forEach(i=>cl[i.c||"Outros"]=(cl[i.c||"Outros"]||0)+i.val);
$("neg").innerHTML=`<div class="kp"><div class="card"><div class="lb">Faturamento</div><div class="big ok">${R(fat)}</div></div><div class="card"><div class="lb">Despesas</div><div class="big bad">${R(dn)}</div></div></div><div class="card"><div class="lb">Resultado de caixa</div><div class="big ${fat-dn<0?"bad":"ok"}">${R(fat-dn)}</div></div><div class="card"><b>Despesas por categoria</b>${DC.N.map(c=>`<div class="row sp"><span>${c}</span><span>${R((cn.find(x=>x[0]===c)||[0,0])[1])}</span></div>`).join("")}</div><div class="card"><b>Receitas por canal</b>${Object.entries(cl).map(([c,v])=>`<div class="row sp"><span>${esc(c)}</span><span>${R(v)}</span></div>`).join("")||VZ}</div>`;
const cr={};mon(m,()=>1).filter(i=>kd(i)==="D"&&cartao(i)).forEach(i=>cr[cartao(i)]=(cr[cartao(i)]||0)+i.val);

$("cars").innerHTML=[...new Set(st.itens.map(cartao).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
}
function fillCat(s){const l=K==="R"?RC:DC[$("tipo").value],u=s&&!l.includes(s)?[...l,s]:l;$("cat").innerHTML=u.map(c=>`<option>${esc(c)}</option>`).join("");if(s)$("cat").value=s}
function setK(k){K=k;[...$("og").children].forEach(b=>b.classList.toggle("on",b.dataset.o===$("tipo").value));[...$("kk").children].forEach(b=>b.classList.toggle("on",b.dataset.k===k));fillCat();$("pw").style.display=k==="D"&&!edit?"":"none";$("cw").style.display=k==="R"&&$("tipo").value==="N"?"":"none"}
function openM(i){edit=i?i.id:null;$("mt").textContent=i?"Editar transação":"Nova transação";$("desc").value=i?i.desc:"";$("val").value=i?i.val:"";$("data").value=i?i.data:hoje;$("tipo").value=i?i.tipo:aba==="N"?"N":"P";$("pg").value=i&&i.pg||"Pix";$("stt").value=i&&i.st||"pago";$("car").value=i&&i.car||"";$("par").value=1;$("canal").value=i&&i.c||"Mercado Livre";$("obs").value=i&&i.obs||"";setK(i?kd(i):"D");if(i)fillCat(i.cat);$("modal").classList.add("show")}
const closeM=()=>$("modal").classList.remove("show");
$("og").onclick=e=>{const b=e.target.closest("button");if(b){$("tipo").value=b.dataset.o;setK(K)}};$("bell").onclick=()=>$("nav").children[0].click();$("kk").onclick=e=>{const b=e.target.closest("button");if(b)setK(b.dataset.k)};$("bk").onclick=closeM;
$("sv").onclick=()=>{const v=parseFloat($("val").value),d=$("desc").value.trim();if(!d||!(v>0)||!$("data").value)return alert("Preencha descrição, valor e data.");
const b={desc:d,val:v,data:$("data").value,tipo:$("tipo").value,cat:$("cat").value,k:K,pg:$("pg").value,st:$("stt").value,car:$("car").value.trim(),c:$("canal").value,obs:$("obs").value.trim()};
if(edit)Object.assign(st.itens.find(x=>x.id===edit),b);else{const n=K==="D"?Math.min(48,Math.max(1,parseInt($("par").value)||1)):1,g=Date.now()+"",p=Math.round(v/n*100)/100;for(let i=0;i<n;i++)st.itens.push({...b,id:g+"-"+i,val:i<n-1?p:Math.round((v-p*(n-1))*100)/100,desc:n>1?d+" ("+(i+1)+"/"+n+")":d,data:addD(b.data,i)})}
save();$("mes").value=b.data.slice(0,7);closeM();render()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const i=st.itens.find(x=>x.id===b.dataset.id);if(!i)return;
if(b.dataset.a==="e")openM(i);else if(b.dataset.a==="d"){st.itens.push({...i,id:Date.now()+""});save();render()}else if(confirm("Excluir este lançamento?")){st.itens=st.itens.filter(x=>x!==i);save();render()}});
$("fab").onclick=()=>openM();$("mes").onchange=render;["q","fc","so"].forEach(x=>$(x).oninput=render);
$("orc").oninput=e=>{st.orc[$("mes").value+"|"+aba]=parseFloat(e.target.value)||0;save();render()};
$("fil").onclick=e=>{const b=e.target.closest("button");if(!b)return;aba=b.dataset.f;[...$("fil").children].forEach(x=>x.classList.toggle("on",x===b));render()};
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;[...$("nav").children].forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="v-"+view));$("fab").style.display=view==="cfg"?"none":"";render()};
$("exp").onclick=()=>{$("io").value=JSON.stringify(st)};
$("imp").onclick=()=>{try{const d=JSON.parse($("io").value);if(!Array.isArray(d.itens))throw 0;if(confirm("Substituir todos os dados atuais?")){st=d;st.orc=st.orc||{};save();render()}}catch(e){alert("Dados inválidos.")}};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
